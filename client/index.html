<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kancl</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect x='4' y='2' width='8' height='6' fill='%23f2c9a0'/><rect x='4' y='2' width='8' height='2' fill='%235b3a1e'/><rect x='6' y='5' width='1' height='1' fill='%23222'/><rect x='9' y='5' width='1' height='1' fill='%23222'/><rect x='4' y='8' width='8' height='5' fill='%234f9be8'/><rect x='4' y='13' width='3' height='2' fill='%23333'/><rect x='9' y='13' width='3' height='2' fill='%23333'/></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1218" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="mini" class="mini-root" hidden></div>
    <div id="digest" class="digest-root" hidden></div>
    <div id="app">
      <aside id="panel">
        <header class="panel-head">
          <div class="logo">
            <span class="logo-pix"></span>
            <h1>Kancl</h1>
          </div>
          <div class="conn" id="conn" title="Spojení se serverem"><span class="dot"></span><span class="conn-text">připojuji</span></div>
        </header>
        <div class="filters" id="filters"></div>
        <ul id="tree" class="tree"></ul>
        <div id="empty" class="empty" hidden>
          <p><b>Zatím žádné sezení.</b></p>
          <p>Jednou nainstaluj hooky:</p>
          <pre>npm run hooks:install</pre>
          <p>a pak spusť <code>claude</code> v libovolném terminálu. Každé sezení se tu objeví jako kolega.</p>
          <button id="demo-btn" class="btn">▶ Pustit ukázkovou partu</button>
        </div>
        <section id="details" class="details" hidden></section>
        <footer class="panel-foot" id="legend">
          <span><i class="sw working"></i>Práce</span>
          <span><i class="sw permission"></i>Dotaz</span>
          <span><i class="sw waiting"></i>Čeká</span>
          <span><i class="sw completed"></i>Hotovo</span>
          <span><i class="sw error"></i>Chyba</span>
        </footer>
      </aside>
      <main id="stage">
        <div id="canvas-host"></div>
        <div id="summary" class="summary"></div>
        <div id="toolbar" class="toolbar">
          <button id="zoom-out" class="btn sm" title="Oddálit">−</button>
          <span id="zoom-label">×2</span>
          <button id="zoom-in" class="btn sm" title="Přiblížit">+</button>
          <button id="zoom-fit" class="btn sm" title="Na okno">okno</button>
        </div>
        <div id="toast" class="toast" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
